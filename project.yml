# Projektbeschreibung für XcodeGen – daraus wird beim Bauen auf GitHub automatisch
# das Xcode-Projekt erzeugt. Du musst hier normalerweise nichts ändern.
name: Budget
options:
  bundleIdPrefix: com.pkrasikow
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Budget:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Budget
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_NAME: Budget
        PRODUCT_BUNDLE_IDENTIFIER: com.pkrasikow.budget
        INFOPLIST_FILE: Budget/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        ENABLE_PREVIEWS: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
