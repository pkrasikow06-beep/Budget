# Baut die Budget-App automatisch auf einem Mac von GitHub
# und stellt die Datei "Budget.ipa" zum Herunterladen bereit.
name: iPhone-App bauen

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Xcode-Version anzeigen
        run: xcodebuild -version

      - name: XcodeGen installieren
        run: brew install xcodegen

      - name: Xcode-Projekt erzeugen
        run: xcodegen generate

      - name: App bauen (ohne Signatur – Sideloadly signiert sie später)
        run: |
          xcodebuild \
            -project Budget.xcodeproj \
            -target Budget \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: IPA-Datei packen
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/Budget.app Payload/
          zip -qry Budget.ipa Payload
          ls -lh Budget.ipa

      - name: IPA zum Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Budget-ipa
          path: Budget.ipa
          retention-days: 90
